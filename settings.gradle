pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Local Fabric 1.21.1 Citadel (not published) - required dependency.
// Path is relative to this project directory; must point to your Citadel 1.21.1 clone.
includeBuild("../Citadel fabric 1.21.1") {
	dependencySubstitution {
		substitute(module("com.github.alexthe666:citadel")).using(project(":"))
	}
}