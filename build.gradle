plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = "alexsmobsfabric"
}

repositories {
	mavenLocal()
}

loom {
	mods {
		"alexsmobs" {
			sourceSet sourceSets.main
		}
	}
}

sourceSets {
	main {
		java {
			// JEI integration is optional and requires JEI API on classpath.
			// Keep sources in tree, but exclude from Fabric core compile until a Fabric JEI integration path is wired.
			exclude "com/github/alexthe666/alexsmobs/compat/jei/**"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation project(':citadel')
	runtimeOnly project(':citadel')
}

tasks.register('copyCitadelJarToLibs', Copy) {
	dependsOn ':citadel:jar'
	from(project(':citadel').tasks.named('jar'))
	into layout.projectDirectory.dir('libs')
	doFirst {
		delete fileTree(dir: 'libs', include: 'citadel*.jar')
	}
}

tasks.named('build') {
	dependsOn 'copyCitadelJarToLibs'
}

tasks.register('copyProductionJars', Copy) {
	dependsOn 'build', ':citadel:build'
	from(layout.buildDirectory.dir('libs')) {
		include "alexsmobsfabric-${mod_version}.jar"
	}
	from(project(':citadel').layout.buildDirectory.dir('libs')) {
		include "citadelfabric-${citadel_version}.jar"
	}
	into layout.projectDirectory.dir('jars')
	doFirst {
		delete fileTree(dir: 'jars', include: '*.jar')
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}

	// Bundle only Citadel asset files into Alex's Mobs resources for dev/runtime.
	// Avoid copying Citadel META-INF/resource root files that conflict in this project.
	from("src Citadel Fabric 26.2/main/resources/assets/citadel") {
		into "assets/citadel"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xmaxerrs', '100000']
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE")
	from("README.md")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}